name: Security False-Positive Benchmark

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  false-positive-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Run offline false-positive benchmark (PR baseline)
        if: github.event_name == 'pull_request'
        run: >
          mvn -q
          "-Dtest=org.example.input_security_starter.benchmark.FalsePositiveBenchmarkTest"
          "-Dfpr.max=0.10"
          "-Dedge.fpr.max=0.25"
          "-Dattack.detect.min=0.95"
          test

      - name: Run offline false-positive benchmark (main baseline)
        if: github.event_name != 'pull_request'
        run: >
          mvn -q
          "-Dtest=org.example.input_security_starter.benchmark.FalsePositiveBenchmarkTest"
          "-Dfpr.max=0.05"
          "-Dedge.fpr.max=0.20"
          "-Dattack.detect.min=0.95"
          test
