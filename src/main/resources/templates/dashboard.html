<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全总览</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #111a2d;
            --panel-2: #16233b;
            --text: #e8eef8;
            --muted: #97a8c3;
            --accent: #2ed3b7;
            --warning: #ffb020;
            --danger: #ff5c7a;
            --line: #243754;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at 20% 10%, #1b2c4b 0%, var(--bg) 42%);
            color: var(--text);
            min-height: 100vh;
        }

        .wrap {
            max-width: 1320px;
            margin: 0 auto;
            padding: 20px 18px 30px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .title {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .nav a {
            color: var(--text);
            text-decoration: none;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-left: 8px;
            font-size: 13px;
        }

        .nav a:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .card {
            background: linear-gradient(140deg, var(--panel-2) 0%, var(--panel) 100%);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
        }

        .card .label {
            color: var(--muted);
            font-size: 12px;
        }

        .card .value {
            margin-top: 10px;
            font-size: 30px;
            font-weight: 700;
            line-height: 1;
        }

        .cards .card:nth-child(1) .value { color: var(--accent); }
        .cards .card:nth-child(2) .value { color: #6bc2ff; }
        .cards .card:nth-child(3) .value { color: var(--warning); }
        .cards .card:nth-child(4) .value { color: var(--danger); }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .panel {
            background: linear-gradient(140deg, var(--panel-2) 0%, var(--panel) 100%);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
        }

        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--muted);
        }

        .panel-title .mode {
            color: var(--accent);
            font-weight: 700;
        }

        .chart {
            width: 100%;
            height: 360px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar select, .btn {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text);
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn:hover, .toolbar select:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            border-bottom: 1px solid var(--line);
            padding: 10px;
            text-align: left;
            word-break: break-word;
        }

        th {
            color: var(--muted);
            font-weight: 600;
        }

        tbody tr:hover {
            background: rgba(46, 211, 183, 0.06);
        }

        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }

        .pill.hit { background: rgba(255, 176, 32, 0.2); color: #ffd27a; }
        .pill.ok { background: rgba(46, 211, 183, 0.2); color: #8cf8e6; }

        .actions {
            margin-top: 10px;
            text-align: right;
        }

        @media (max-width: 980px) {
            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .top {
                flex-direction: column;
                align-items: flex-start;
            }
            .nav a {
                margin: 0 8px 8px 0;
                display: inline-block;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div>
            <h1 class="title">Input Security 安全总览</h1>
            <p class="subtitle">比赛展示视图 - 实时态势与关键指标</p>
        </div>
        <div class="nav">
            <a href="/input-security-view/analysis">分析报告</a>
            <a href="/input-security-view/events">事件明细</a>
            <a href="/input-security-view/test">攻防演示台</a>
        </div>
    </div>

    <div class="cards">
        <div class="card">
            <div class="label">总事件数（内存）</div>
            <div id="totalEvents" class="value">0</div>
        </div>
        <div class="card">
            <div class="label">攻击类型数</div>
            <div id="attackTypes" class="value">0</div>
        </div>
        <div class="card">
            <div class="label">分析报告数</div>
            <div id="reportCount" class="value">0</div>
        </div>
        <div class="card">
            <div class="label">待处理告警</div>
            <div id="pendingAlerts" class="value">0</div>
        </div>
    </div>

    <div class="grid">
        <div class="panel">
            <div class="panel-title">
                <span>最近24小时攻击趋势</span>
                <span class="mode">mode: <span th:text="${mode}"></span></span>
            </div>
            <div id="trendChart" class="chart"></div>
        </div>
        <div class="panel">
            <div class="panel-title">攻击类型分布</div>
            <div id="pieChart" class="chart"></div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">
            <span id="latestTitle">最新安全事件（Top 20）</span>
            <div class="toolbar">
                <label for="eventsLimit">条数</label>
                <select id="eventsLimit" onchange="refreshEvents()">
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>时间</th>
                    <th>规则</th>
                    <th>IP</th>
                    <th>输入摘要</th>
                    <th>状态</th>
                </tr>
                </thead>
                <tbody id="eventsBody">
                <tr>
                    <td colspan="5">加载中...</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="actions">
            <button class="btn" onclick="refreshAll()">刷新数据</button>
        </div>
    </div>
</div>

<script>
    let trendChart;
    let pieChart;

    function initCharts() {
        trendChart = echarts.init(document.getElementById("trendChart"));
        pieChart = echarts.init(document.getElementById("pieChart"));
        window.addEventListener("resize", function () {
            trendChart.resize();
            pieChart.resize();
        });
    }

    function setCards(stats, status) {
        const typeDistribution = (stats && stats.typeDistribution) ? stats.typeDistribution : [];
        const totalEvents = (stats && typeof stats.totalEvents === "number") ? stats.totalEvents : 0;
        const reportCount = status && typeof status.reportCount === "number" ? status.reportCount : 0;
        const pendingAlerts = status && status.alertCounter ? (status.alertCounter.unprocessedCount || 0) : 0;

        document.getElementById("totalEvents").textContent = String(totalEvents);
        document.getElementById("attackTypes").textContent = String(typeDistribution.length);
        document.getElementById("reportCount").textContent = String(reportCount);
        document.getElementById("pendingAlerts").textContent = String(pendingAlerts);
    }

    function renderTrend(trend) {
        const series = (trend && trend.series) ? trend.series : [];
        const timeAxis = (trend && trend.timeAxis) ? trend.timeAxis : [];
        trendChart.setOption({
            backgroundColor: "transparent",
            tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
            legend: { textStyle: { color: "#c8d5ea" } },
            grid: { left: 8, right: 8, bottom: 16, top: 30, containLabel: true },
            xAxis: { type: "category", data: timeAxis, axisLabel: { color: "#9fb3d0", rotate: 30 } },
            yAxis: { type: "value", axisLabel: { color: "#9fb3d0" }, splitLine: { lineStyle: { color: "#223653" } } },
            series: series.map(function (s) {
                return {
                    name: s.name,
                    type: "bar",
                    stack: "total",
                    data: s.data
                };
            })
        });
    }

    function renderPie(typeDistribution) {
        const data = typeDistribution || [];
        pieChart.setOption({
            backgroundColor: "transparent",
            tooltip: { trigger: "item" },
            legend: {
                bottom: 0,
                textStyle: { color: "#c8d5ea" },
                type: "scroll"
            },
            series: [{
                type: "pie",
                radius: ["35%", "72%"],
                center: ["50%", "45%"],
                data: data,
                label: { color: "#d9e5f7" },
                itemStyle: { borderColor: "#0f1829", borderWidth: 2 }
            }]
        });
    }

    function renderEvents(events, limit) {
        const tbody = document.getElementById("eventsBody");
        if (!events || events.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5'>暂无数据</td></tr>";
            return;
        }
        document.getElementById("latestTitle").textContent = "最新安全事件（Top " + limit + "）";
        const html = events.map(function (e) {
            const rule = e.ruleName || "-";
            const ip = e.ipAddress || "-";
            const input = (e.inputSnippet || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const statusClass = e.ruleName ? "pill hit" : "pill ok";
            const statusText = e.ruleName ? "命中" : "通过";
            return "<tr>" +
                "<td>" + (e.formattedTimestamp || "-") + "</td>" +
                "<td>" + rule + "</td>" +
                "<td>" + ip + "</td>" +
                "<td>" + input + "</td>" +
                "<td><span class='" + statusClass + "'>" + statusText + "</span></td>" +
                "</tr>";
        }).join("");
        tbody.innerHTML = html;
    }

    async function refreshEvents() {
        const limit = document.getElementById("eventsLimit").value || "20";
        try {
            const eventsRes = await fetch("/input-security-api/events?limit=" + encodeURIComponent(limit));
            const events = await eventsRes.json();
            renderEvents(events, limit);
        } catch (e) {
            document.getElementById("eventsBody").innerHTML = "<tr><td colspan='5'>数据加载失败: " + e.message + "</td></tr>";
        }
    }

    async function refreshAll() {
        try {
            const [statsRes, statusRes] = await Promise.all([
                fetch("/input-security-api/stats?lastNHours=24"),
                fetch("/input-security-api/llm/status")
            ]);
            const stats = await statsRes.json();
            const status = await statusRes.json();

            setCards(stats, status);
            renderTrend(stats.trend || {});
            renderPie(stats.typeDistribution || []);
            await refreshEvents();
        } catch (e) {
            document.getElementById("eventsBody").innerHTML = "<tr><td colspan='5'>数据加载失败: " + e.message + "</td></tr>";
        }
    }

    initCharts();
    refreshAll();
    setInterval(refreshAll, 20000);
</script>
</body>
</html>
