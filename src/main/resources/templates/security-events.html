<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全事件明细</title>
    <style>
        body {
            margin: 0;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: #f4f7fc;
            color: #1e2c3f;
        }

        .wrap {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 16px 30px;
        }

        .nav {
            margin-bottom: 12px;
        }

        .nav a {
            text-decoration: none;
            color: #2f5bc6;
            margin-right: 12px;
            font-size: 14px;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .mode-info {
            margin: 10px 0 14px;
            background: #e8eefb;
            border: 1px solid #cdd9f3;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
        }

        .toolbar {
            margin-bottom: 10px;
            background: #fff;
            border: 1px solid #dae3f1;
            border-radius: 10px;
            padding: 10px;
        }

        .toolbar input[type="number"] {
            width: 90px;
            border: 1px solid #c6d4ea;
            border-radius: 6px;
            padding: 6px;
            margin-right: 6px;
        }

        button {
            border: none;
            border-radius: 8px;
            background: #2c56bd;
            color: #fff;
            padding: 8px 12px;
            cursor: pointer;
            margin-right: 6px;
        }

        button:hover {
            background: #214394;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid #dae3f1;
            border-radius: 10px;
            overflow: hidden;
            table-layout: fixed;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ebf0f8;
            text-align: left;
            font-size: 13px;
            word-break: break-word;
        }

        th {
            background: #f1f5fb;
            color: #4c607e;
        }

        td:nth-child(1), th:nth-child(1) { width: 180px; }
        td:nth-child(3), th:nth-child(3) { width: 170px; }
        td:nth-child(4), th:nth-child(4) { width: 90px; }
        td:nth-child(5), th:nth-child(5) { width: 140px; }

        .desc {
            color: #60738f;
            margin: 8px 0 14px;
            font-size: 13px;
        }

        @media (max-width: 980px) {
            .wrap {
                padding-left: 10px;
                padding-right: 10px;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="nav">
        <a href="/input-security-view/dashboard">安全总览</a>
        <a href="/input-security-view/analysis">分析报告</a>
        <a th:href="@{/input-security-view/test}">攻防演示台</a>
    </div>

    <h1>安全事件明细</h1>
    <div class="mode-info">
        当前工作模式: <strong th:text="${mode}"></strong>
    </div>
    <div class="desc">本页专注事件明细查询。趋势图和分布图请查看“安全总览”页面。</div>

    <form action="#" th:action="@{/input-security-view/events}" method="get" class="toolbar">
        <label for="limit">显示条数:</label>
        <input type="number" id="limit" name="limit" th:value="${limit}" min="1" max="1000">
        <button type="submit">刷新列表</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>时间</th>
            <th>输入摘要</th>
            <th>匹配规则</th>
            <th>动作</th>
            <th>IP地址</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td th:text="${event.formattedTimestamp}"></td>
            <td th:text="${event.inputSnippet}"></td>
            <td th:text="${event.ruleName ?: '无'}"></td>
            <td th:text="${mode == 'block' and event.ruleName != null ? '拦截' : '放行'}"></td>
            <td th:text="${event.ipAddress ?: '未知'}"></td>
        </tr>
        <tr th:if="${events.empty}">
            <td colspan="5" style="text-align:center;">暂无安全事件</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
